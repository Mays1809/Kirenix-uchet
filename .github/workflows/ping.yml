# Будильник для Supabase.
# На бесплатном тарифе проект засыпает, если неделю не было обращений к базе.
# Спящий проект — это не только неработающая оплата, но и невозможность
# войти по коду на новом устройстве. Поэтому раз в сутки стучимся сами.
name: ping

on:
  schedule:
    - cron: "0 9 * * *"     # каждый день в 12:00 по Москве
  workflow_dispatch:         # и кнопкой вручную, если понадобится

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить сервер
        run: |
          echo "Стучимся в функцию…"
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            https://fbtbefprcnpnqbyxgebo.supabase.co/functions/v1/kirenix/ping)
          echo "Ответ: $code"
          cat /tmp/out.txt
          echo
          test "$code" = "200"

  # GitHub сам выключает расписание, если в открытом репозитории 60 дней ничего не менялось.
  # Поэтому, когда последнее изменение старше 40 дней, делаем пустой коммит — файлы и сайт не меняются.
  # Запуск кнопкой (Run workflow) делает такую отметку сразу — так можно проверить, что всё работает.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Не дать GitHub выключить будильник
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Последнее изменение в репозитории: $days дн. назад"
          if [ "$days" -ge 40 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Будильник: отметка, чтобы GitHub не выключил расписание"
            git push origin HEAD:${{ github.ref_name }}
          fi
